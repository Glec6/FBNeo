name: Build FBNeo Libretro

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout FBNeo
        uses: actions/checkout@v4

      - name: Show repository
        run: |
          echo "FBNeo repository:"
          ls -la
          echo
          echo "Top-level Makefile:"
          head -100 makefile

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Show Makefile targets
        run: |
          make help || true
          echo
          echo "Available make targets:"
          grep -E '^[a-zA-Z0-9_-]+:' makefile | head -100

      - name: Build FBNeo
        run: |
          make -f makefile

      - name: Find compiled files
        run: |
          echo "Searching for compiled files..."
          find . -type f \( -name "*.so" -o -name "*.dll" -o -name "*.elf" \) | head -100

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: fbneo-build
          path: |
            **/*.so
            **/*.elf
          if-no-files-found: warn
